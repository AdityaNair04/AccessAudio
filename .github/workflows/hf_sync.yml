name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        uses: nateraw/huggingface-sync-action@v0.0.5
        with:
          github_repo_id: "AdityaNair04/AccessAudio"
          huggingface_repo_id: "An1204/AccessAudio"
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: "space"
          space_sdk: "docker"
          private: false
