@if (isMobile.matches) {
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-list-header lines="full">
          <ion-label>Pages</ion-label>
        </ion-list-header>
        <ion-menu-toggle>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
    <ion-footer>
      <ion-button routerLink="/" color="primary" queryParamsHandling="preserve" fill="clear">
        {{ 'landing.try' | transloco }}
      </ion-button>
    </ion-footer>
  </ion-menu>
}

<ion-header [translucent]="true">
  <ion-toolbar>
    @if (isMobile.matches) {
      <ion-buttons slot="start">
        <ion-menu-button auto-hide="true"></ion-menu-button>
      </ion-buttons>
    }
    <ion-title>
      <app-logo />
    </ion-title>
    @if (!isMobile.matches) {
    }
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" id="main-content">
  <router-outlet />
</ion-content>
